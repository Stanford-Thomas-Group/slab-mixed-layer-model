name: Python CI

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"

defaults:
  run:
    working-directory: python

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest
